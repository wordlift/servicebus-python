name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: Guard
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Fail if tag is not on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor ${{ github.sha }} origin/main \
            || { echo "::error::Tag ${{ github.ref_name }} is not on main — aborting release."; exit 1; }

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: guard
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --dev --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest -q

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write  # required for GitHub Packages

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --dev --frozen

      - name: Assert version matches tag
        run: |
          pkg_version=$(uv run python -c "import importlib.metadata; print(importlib.metadata.version('wordlift-servicebus'))")
          tag="${{ github.ref_name }}"
          if [[ "${pkg_version}" != "${tag}" ]]; then
            echo "::error::pyproject.toml version (${pkg_version}) does not match tag (${tag})"
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Publish to GitHub Packages
        run: uv publish --publish-url https://pypi.pkg.github.com/wordlift/
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
