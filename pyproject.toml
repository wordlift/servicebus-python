[project]
name = "wordlift-servicebus"
version = "0.1.0-rc1"
description = "Reusable Azure Service Bus consumers, publishers, and receiver factories for WordLift services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "azure-servicebus>=7.14.2",
]

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.0.0",
    "pre-commit>=4.0.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
]
